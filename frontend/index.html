<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Control de proyectos y recursos de los laboratorios de la FaCyT, Universidad de Carabobo"
    />
    <title>Control de Proyectos · FaCyT</title>
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee (ver src/lib/tema.ts).
      try {
        var t = localStorage.getItem('cpq-tema')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body class="mk">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
